name: Maize Crush Android Release Candidate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Babylon.js runtime
        run: npm install --no-save --no-package-lock --ignore-scripts babylonjs@9.36.0 babylonjs-loaders@9.36.0
      - name: Prepare local web and Android 3D runtime
        run: node scripts/prepare-babylon-runtime.js
      - name: Install Blender for authored environment models
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Generate Blender farmstead model for web and Android
        run: blender --background --python scripts/build_harvest_world_assets.py
      - name: Verify exported farmstead GLB and Android mirror
        run: test -s assets/harvest-world-farmstead.glb && cmp assets/harvest-world-farmstead.glb android/app/src/main/assets/assets/harvest-world-farmstead.glb

      - name: Run gameplay regression tests
        run: npm test

      - name: Verify browser and Android WebView assets are identical
        run: |
          cmp game.js android/app/src/main/assets/game.js
          cmp styles.css android/app/src/main/assets/styles.css
          cmp index.html android/app/src/main/assets/index.html
          cmp manifest.webmanifest android/app/src/main/assets/manifest.webmanifest
          cmp icon.svg android/app/src/main/assets/icon.svg
          cmp privacy-policy.html android/app/src/main/assets/privacy-policy.html
          cmp sw.js android/app/src/main/assets/sw.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify required Android manifest capabilities
        run: |
          grep -q 'android.permission.VIBRATE' android/app/src/main/AndroidManifest.xml
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo "Unexpected internet permission: the current game is offline-only."
            exit 1
          fi

      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME/platforms" && echo "Android SDK found"

      - name: Install Android 16 SDK platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Android release variants
        run: gradle -p android --no-daemon assembleRelease bundleRelease

      - name: Verify release outputs exist
        run: |
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/bundle/release/app-release.aab

      - name: Verify Android APK package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING"
          grep -F "package: name='com.maizecrush.zimbabweharvest' versionCode='1' versionName='1.0.0'" <<< "$BADGING"
          grep -F "sdkVersion:'24'" <<< "$BADGING"
          grep -F "targetSdkVersion:'36'" <<< "$BADGING"
          grep -F "application-label:'Maize Crush'" <<< "$BADGING"

      - name: Upload unsigned release candidates
        uses: actions/upload-artifact@v4
        with:
          name: maize-crush-unsigned-release-candidate
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14


      - name: Smoke-test signing with a temporary CI key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/maize-crush-ci-smoke.jks"
          STORE_PASSWORD="maize-crush-ci-smoke-only"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          keytool -genkeypair -noprompt -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias "ci-smoke" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Maize Crush CI Smoke Test,O=Maize Crush,C=ZW"
          ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" \
          ANDROID_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
          ANDROID_KEY_ALIAS="ci-smoke" \
          ANDROID_KEY_PASSWORD="$STORE_PASSWORD" \
            gradle -p android --no-daemon assembleRelease bundleRelease
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify "$AAB"
      - name: Enable KVM group perms
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch signed release APK on Android emulator
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.maizecrush.zimbabweharvest/.MainActivity
            sleep 8
            test -n "$(adb shell pidof com.maizecrush.zimbabweharvest)"
            if adb logcat -d -t 1000 | grep -E 'FATAL EXCEPTION.*com\.maizecrush\.zimbabweharvest'; then echo "Maize Crush crashed during emulator startup."; exit 1; fi
