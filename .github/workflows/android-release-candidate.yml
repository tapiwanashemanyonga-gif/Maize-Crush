name: Maize Crush Android Release Candidate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run gameplay regression tests
        run: npm test

      - name: Verify browser and Android WebView assets are identical
        run: |
          cmp game.js android/app/src/main/assets/game.js
          cmp styles.css android/app/src/main/assets/styles.css
          cmp index.html android/app/src/main/assets/index.html
          cmp manifest.webmanifest android/app/src/main/assets/manifest.webmanifest
          cmp icon.svg android/app/src/main/assets/icon.svg
          cmp privacy-policy.html android/app/src/main/assets/privacy-policy.html
          cmp sw.js android/app/src/main/assets/sw.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify required Android manifest capabilities
        run: |
          grep -q 'android.permission.VIBRATE' android/app/src/main/AndroidManifest.xml
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo "Unexpected internet permission: the current game is offline-only."
            exit 1
          fi

      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME/platforms" && echo "Android SDK found"

      - name: Install Android 16 SDK platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Android release variants
        run: gradle -p android --no-daemon assembleRelease bundleRelease

      - name: Verify release outputs exist
        run: |
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload unsigned release candidates
        uses: actions/upload-artifact@v4
        with:
          name: maize-crush-unsigned-release-candidate
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test signing with a temporary CI key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/maize-crush-ci-smoke.jks"
          STORE_PASSWORD="maize-crush-ci-smoke-only"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          keytool -genkeypair -noprompt -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias "ci-smoke" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Maize Crush CI Smoke Test,O=Maize Crush,C=ZW"
          ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" \
          ANDROID_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
          ANDROID_KEY_ALIAS="ci-smoke" \
          ANDROID_KEY_PASSWORD="$STORE_PASSWORD" \
            gradle -p android --no-daemon assembleRelease bundleRelease
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify "$AAB"
