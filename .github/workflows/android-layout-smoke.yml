name: Maize Crush Android Device Layout Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run gameplay regression tests
        run: npm test
      - name: Test Android UI smoke helper
        run: python3 -m unittest discover -s tests -p 'test_android_layout_smoke.py'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME/platforms"
      - name: Install Android 16 SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Android debug APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Upload debug APK for device matrix
        uses: actions/upload-artifact@v4
        with:
          name: maize-crush-layout-smoke-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  runtime-smoke:
    needs: build-debug
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: pixel_2
            device_class: compact-phone
          - profile: pixel_tablet
            device_class: tablet
    name: Runtime smoke (${{ matrix.device_class }})
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: maize-crush-layout-smoke-apk
          path: app
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch and verify the real crop board and gestures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            set -euo pipefail
            test -n "$(find app -type f -name 'app-debug.apk' -print -quit)" || { echo "Downloaded debug APK was not found."; find app -type f -print; exit 1; }
            adb install -r "$(find app -type f -name 'app-debug.apk' -print -quit)"
            adb shell pm clear com.maizecrush.zimbabweharvest
            adb logcat -c
            adb shell am start -W -n com.maizecrush.zimbabweharvest/.MainActivity
            sleep 3
            python3 scripts/android_layout_smoke.py
      - name: Upload UI screenshots and accessibility snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maize-crush-ui-smoke-${{ matrix.device_class }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
