name: Publish Maize Crush Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Babylon.js runtime
        run: npm install --no-save --no-package-lock --ignore-scripts babylonjs@9.36.0 babylonjs-loaders@9.36.0
      - name: Prepare local web and Android 3D runtime
        run: node scripts/prepare-babylon-runtime.js
      - name: Install Blender for authored environment models
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy
      - name: Generate Blender-authored world models for web and Android
        shell: bash
        run: |
          set -euo pipefail
          blender --background --python scripts/build_harvest_world_assets.py
          blender --background --python scripts/build_harvest_world_terrain.py
          test -s assets/harvest-world-farmstead.glb
          test -s assets/harvest-world-terrain.glb
          cmp assets/harvest-world-farmstead.glb android/app/src/main/assets/assets/harvest-world-farmstead.glb
          cmp assets/harvest-world-terrain.glb android/app/src/main/assets/assets/harvest-world-terrain.glb

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish playable game
        id: deployment
        uses: actions/deploy-pages@v4
