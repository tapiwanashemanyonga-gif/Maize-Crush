name: Publish Maize Crush Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Install pinned Babylon.js runtime
        run: npm install --no-save --no-package-lock --ignore-scripts babylonjs@9.36.0
      - name: Prepare local web and Android 3D runtime
        run: node scripts/prepare-babylon-runtime.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish playable game
        id: deployment
        uses: actions/deploy-pages@v4
